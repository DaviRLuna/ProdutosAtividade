    <title>Loja de produtos</title>
    <style>
        div {
            background-color: rgb(220, 215, 209);
            border: solid 1px black;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        body {
            background-color: rgb(202, 188, 171);
            height: 100vh;
            gap: 30px;
            height: 100vh;
        }
        .conteiner {
            width: 97%;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 10px;
            overflow-x: auto;
        }

        .caixa {
            width: 280px;
            height: 440px;

        }
        header{
            display:flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: rgb(241, 208, 25);
            width: 100%;
            height: 300px;
            gap: 20px;
        }
        #produtos{
            display: grid;
            grid-template-columns: auto auto auto auto;
            padding: 20px;
        }
        p{
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        header h1{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 4rem;
        }
        article{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        button{
            width: 150px;
            height: 50px;
            border-radius: 10px;
            background-color: rgb(255, 255, 255);
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        img{
            height: 200px;

        }
    </style>
</head>

        function criarProduto(){
        catalagoProdutos.forEach(produtos => {
            const Caixa = document.createElement('div');
            const Produto = document.createElement('p');
            produtos.forEach((iten, index) => {
                if(index === 0) {
                    const image = document.createElement('img');
                    image.src = iten;
                    Caixa.appendChild(image);
                    return;
                }
                console.log(iten);
                const tag = index === 1 ? 'h1' : 'p';
                const PRODUTO = document.createElement(tag);
                PRODUTO.innerText = iten;
                Caixa.appendChild(PRODUTO);
            })
            const Produtos = document.getElementById('produtos');
            Caixa.classList.add('caixa');
            Produtos.classList.add('conteiner');
            Produtos.appendChild(Caixa);
        });
