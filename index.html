    <style>
        div {
            background-color: rgb(219, 179, 131);
            border: solid 1px black;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        body {
            background-color:rgb(150, 150, 167);
            height: 100vh;
            gap: 30px;
            height: 100vh;
        }
        .conteiner {
            width: 97%;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 10px;
            overflow-x: auto;
        }

        .caixa {
            width: 280px;
            height: 440px;
            display: flex;
            justify-content: center;
            align-items: center
        }
        header{
            display:flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: rgb(255, 255, 254);
            border-radius: 10px;
            border: 2px solid black;
            width: 100%;
            height: 300px;
            gap: 20px;
        }
        #produtos{
            display: grid;
            grid-template-columns: auto auto auto auto;
            padding: 20px;
            gap: 10px;
            text-align: center;
        }
        p{
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            padding: 10px;
        }
        header h1{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 4rem;
        }
        article{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        button{
            width: 150px;
            height: 50px;
            border-radius: 10px;
            background-color: rgb(255, 255, 255);
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        img{
            height: 200px;
        }
    </style>
</head>

        <section>

    </header>

        const sectionCards = document.getElementById('produtos');
        const inputPesquisa = document.getElementById('texto');

        function criarProduto(produtos){
            sectionCards.innerHTML = '';

            produtos.forEach(produtos =>{
                const Caixa = document.createElement('div');
                const Produto = document.createElement('p');
                const Titulo = document.createElement('h2');
                const img = document.createElement('img');

                Titulo.textContent = produtos.produto
                Produto.innerHTML = `<br> ${produtos.descricao} <br> ${produtos.tipo} <br> ${produtos.preco}`;
                img.src = produtos.imagem;
                Caixa.classList.add('caixa');
                Caixa.appendChild(img);
                Caixa.appendChild(Titulo);
                Caixa.appendChild(Produto);
                sectionCards.appendChild(Caixa);
            })
        }
        function pesquisar() {
            const produtoDesejado = texto.value.trim();

            const produtosCorrespondentes = catalagoProdutos.filter((produto) => {
                return produto.produto.toLowerCase().includes(produtoDesejado.toLowerCase());
            })

            if(produtosCorrespondentes.length == 0) {
                sectionCards.innerHTML = '';

                const mensagem = document.createElement('p');
                mensagem.textContent = 'Não há esse produto';

                sectionCards.appendChild(mensagem);
                return;
            } else {
                criarProduto(produtosCorrespondentes);
            }
        }

        inputPesquisa.addEventListener('input', pesquisar);
        criarProduto(catalagoProdutos);
